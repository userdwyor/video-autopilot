<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Office + Agents</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #e0f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20px; font-weight: bold; color: #333; z-index: 100; text-align: center;
        }
        .name-tag {
            background: white; padding: 4px 10px; border-radius: 10px;
            font-size: 14px; font-weight: bold; color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: none; transform: translateY(-20px);
        }
    </style>
</head>
<body>
    <div id="loading">⏳ Memuat Ruangan & Tim AI...</div>

    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0f7fa);

        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 40; // Jarak kamera (makin besar makin jauh)
        const camera = new THREE.OrthographicCamera(frustumSize * aspect / - 2, frustumSize * aspect / 2, frustumSize / 2, frustumSize / - 2, 1, 1000);
        camera.position.set(20, 20, 20); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        let manager, writer, researcher, player, editor, admin, designer;
        let isLoaded = false;

        function createAgent(name, color, x, y, z) {
            const agentGroup = new THREE.Group();
            agentGroup.position.set(x, y, z);
            // Ukuran karakter (kalau kegedean, kecilin angkanya)
            agentGroup.scale.set(2.5, 2.5, 2.5); 

            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.8, 4, 8), new THREE.MeshStandardMaterial({ color: color }));
            body.position.y = 0.8; body.castShadow = true; agentGroup.add(body);
            
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffcc80 }));
            head.position.y = 1.8; head.castShadow = true; agentGroup.add(head);

            const div = document.createElement('div'); div.className = 'name-tag'; div.textContent = name;
            const label = new CSS2DObject(div); label.position.set(0, 2.5, 0); agentGroup.add(label);
            
            scene.add(agentGroup); 
            return agentGroup;
        }

        const loader = new GLTFLoader();
        // PAKAI LINK JSDELIVR YANG TADI UDAH BERHASIL
        loader.load('https://cdn.jsdelivr.net/gh/userdwyon/video-autopilot@main/office.glb', function (gltf) {
            const model = gltf.scene;
            model.scale.set(0.6, 0.6, 0.6); // Kecilin gedungnya
            model.position.set(0, -3, 0); // Turunin gedung
            
            model.traverse((node) => {
                if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
            });
            scene.add(model);
            document.getElementById('loading').style.display = 'none';

            // TARUH KARYAWAN DI ATAS/SEKITAR GEDUNG
            manager = createAgent("Manager", 0x42a5f5, -8, 5, 8);
            writer = createAgent("Sinta", 0xab47bc, 8, 5, 8);
            researcher = createAgent("Dewi", 0xf06292, -8, 5, -8);
            player = createAgent("Budi", 0x66bb6a, 8, 5, -8);
            editor = createAgent("Rina", 0xffca28, 0, 5, 0);
            admin = createAgent("Joko", 0xef5350, 0, 5, 12);
            designer = createAgent("Andi", 0xffa726, 12, 5, 0);
            
            isLoaded = true;
        }, undefined, function (error) {
            document.getElementById('loading').innerText = "❌ Gagal memuat file 3D. Cek koneksi internet.";
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (isLoaded) {
                if(manager) {
                    manager.position.x = -8 + Math.sin(time * 1.5) * 3;
                    manager.rotation.y = Math.cos(time * 1.5) > 0 ? Math.PI/2 : -Math.PI/2;
                }
                if(writer) writer.position.y = 5 + Math.abs(Math.sin(time * 10)) * 0.2;
                if(researcher) researcher.rotation.y = time * 0.5;
                if(player) player.position.y = 5 + Math.abs(Math.sin(time * 2)) * 0.5;
                if(editor) editor.rotation.z = Math.sin(time * 3) * 0.1;
                if(admin) admin.rotation.y = Math.sin(time * 1) * 0.5;
                if(designer) designer.position.y = 5 + Math.abs(Math.sin(time * 4)) * 0.8;
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2; camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2; camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
