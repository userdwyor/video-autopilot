<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 3D Cartoon Office</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fce4ec; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; z-index: 100; pointer-events: none; }
        h2 { margin: 5px; text-shadow: 1px 1px 2px white; }
    </style>
</head>
<body>
    <div id="info"><h2>🏢 Kantor Virtual Tim AI</h2><p>Geser layar buat muter ruangan!</p></div>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Setup Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0f7fa); // Warna langit pastel
        scene.fog = new THREE.Fog(0xe0f7fa, 20, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Shadow lebih halus (kartun)
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Lighting (Pencahayaan studio kartun)
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffe082, 1.5);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Lantai (Warna karpet pastel)
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xfff9c4, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Hiasan Tanaman
        function createPlant(x, z) {
            const plantGroup = new THREE.Group();
            const potGeo = new THREE.CylinderGeometry(0.6, 0.4, 1, 8);
            const potMat = new THREE.MeshStandardMaterial({ color: 0xff8a65 });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.y = 0.5; pot.castShadow = true;
            plantGroup.add(pot);
            
            const leafGeo = new THREE.SphereGeometry(0.8, 8, 8);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x81c784 });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 1.5; leaf.castShadow = true;
            plantGroup.add(leaf);

            plantGroup.position.set(x, 0, z);
            scene.add(plantGroup);
        }
        createPlant(-12, -12); createPlant(12, -12); createPlant(-12, 12); createPlant(12, 12);

        // Karakter Agent
        function createAgent(color) {
            const agent = new THREE.Group();
            
            // Badan
            const bodyGeo = new THREE.CapsuleGeometry(0.6, 1.2, 4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.2; body.castShadow = true;
            agent.add(body);

            // Kepala
            const headGeo = new THREE.SphereGeometry(0.7, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc80 }); // Warna kulit
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.5; head.castShadow = true;
            agent.add(head);

            // Mata
            const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.25, 2.6, 0.6);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.25, 2.6, 0.6);
            agent.add(eyeL); agent.add(eyeR);

            return agent;
        }

        // --- SETUP KANTOR & AKTIVITAS ---

        // 1. Manager: Jalan bolak-balik
        const manager = createAgent(0x64b5f6); // Biru
        manager.position.set(-6, 0, -6);
        scene.add(manager);

        // 2. Scriptwriter: Duduk Ngetik
        const writer = createAgent(0xba68c8); // Ungu
        writer.position.set(6, 0, -6);
        scene.add(writer);
        // Meja Ngetik
        const deskGeo = new THREE.BoxGeometry(2, 1, 1.5);
        const deskMat = new THREE.MeshStandardMaterial({ color: 0x90a4ae });
        const desk = new THREE.Mesh(deskGeo, deskMat);
        desk.position.set(6, 0.5, -5);
        desk.castShadow = true; desk.receiveShadow = true;
        scene.add(desk);

        // 3. Sholat: Pakai Sajadah
        const prayer = createAgent(0x81c784); // Hijau
        prayer.position.set(-6, 0, 6);
        scene.add(prayer);
        // Sajadah
        const matGeo = new THREE.PlaneGeometry(2, 3);
        const matMat = new THREE.MeshStandardMaterial({ color: 0x4db6ac });
        const prayerMat = new THREE.Mesh(matGeo, matMat);
        prayerMat.rotation.x = -Math.PI / 2;
        prayerMat.position.set(-6, 0.01, 7); // Sedikit di atas lantai
        prayerMat.receiveShadow = true;
        scene.add(prayerMat);

        // 4. Main Bola: Karakter Loncat-loncat
        const player = createAgent(0xffb74d); // Oranye
        player.position.set(6, 0, 6);
        scene.add(player);
        // Bola
        const ballGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xe53935 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        scene.add(ball);

        // 5. Ngopi: Karakter di tengah
        const coffee = createAgent(0xf06292); // Pink
        coffee.position.set(0, 0, 0);
        scene.add(coffee);
        // Meja Kopi
        const tableGeo = new THREE.CylinderGeometry(1, 1, 1.5, 16);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.set(2, 0.75, 0);
        table.castShadow = true;
        scene.add(table);

        // --- ANIMASI LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 1. Manager jalan (geser X)
            manager.position.x = -6 + Math.sin(time * 1.5) * 3;
            // Rotasi badan manager sesuai arah jalan
            manager.rotation.y = Math.cos(time * 1.5) > 0 ? 0 : Math.PI;

            // 2. Scriptwriter ngetik (bobbing naik turun)
            writer.position.y = Math.abs(Math.sin(time * 10)) * 0.1;

            // 3. Sholat (Rukuk & Sujud)
            // Kita pakai siklus sinus buat gerakin rotasi X (nunduk)
            const prayCycle = Math.sin(time * 0.5); // Pelan aja
            if (prayCycle > 0.5) {
                // Posisi Sujud
                prayer.rotation.x = -Math.PI / 3;
                prayer.position.y = -0.5; // Turun ke bawah
            } else {
                // Posisi Berdiri
                prayer.rotation.x = 0;
                prayer.position.y = 0;
            }

            // 4. Main Bola (Loncat-loncat ngejar bola)
            player.position.y = Math.abs(Math.sin(time * 4)) * 1.5; // Loncat
            // Bola muter dan mantul
            ball.position.set(6 + Math.cos(time * 4) * 2, 0.4 + Math.abs(Math.sin(time * 8)) * 1, 6);
            ball.rotation.x += 0.05;
            ball.rotation.z += 0.05;

            // 5. Ngopi (Karakter goyang-goyang santai)
            coffee.rotation.z = Math.sin(time * 2) * 0.05;
            coffee.rotation.y = Math.sin(time * 0.5) * 0.2;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
