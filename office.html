<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric AI Office</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* UI Overlay untuk Feed Aktivitas */
        #activity-feed {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
            max-width: 400px;
            margin: 0 auto;
        }
        #activity-feed h4 { margin: 0 0 5px 0; font-size: 14px; color: #333; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        .log-item { font-size: 12px; margin-bottom: 3px; color: #555; display: flex; align-items: center; gap: 5px;}
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

        /* Label Nama Melayang */
        .name-tag {
            background: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: none;
            transform: translateY(-10px);
        }
    </style>
</head>
<body>
    <!-- Feed Aktivitas Bawah -->
    <div id="activity-feed">
        <h4>📋 Aktivitas Kantor (Live)</h4>
        <div id="log-list">
            <div class="log-item"><span class="dot" style="background:#ff5252"></span> <b>Manager:</b> Lagi muter ngawasin kerjaan...</div>
            <div class="log-item"><span class="dot" style="background:#7c4dff"></span> <b>Scriptwriter:</b> Ngetik naskah video baru...</div>
            <div class="log-item"><span class="dot" style="background:#4caf50"></span> <b>Budi:</b> Lagi sholat dulu ya...</div>
            <div class="log-item"><span class="dot" style="background:#ff9800"></span> <b>Sinta:</b> Main bola biar otak fresh...</div>
        </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- SETUP DASAR ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe3f2fd);

        // KAMERA ISOMETRIK
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 30;
        const camera = new THREE.OrthographicCamera(frustumSize * aspect / - 2, frustumSize * aspect / 2, frustumSize / 2, frustumSize / - 2, 1, 1000);
        camera.position.set(20, 20, 20); // Posisi miring dari atas

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // RENDERER UNTUK NAMA TAG
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // KONTROL
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableRotate = false; // Matiin rotate biar tetep isometrik
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

        // --- PENCAHAYAAN ---
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // --- LANTAI & DINDING ---
        // Lantai Utama
        const floorGeo = new THREE.PlaneGeometry(24, 24);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Fungsi Bikin Lantai Warna (Zona)
        function createZone(x, z, w, h, color) {
            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x, 0.01, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        // Zona Kantor (Biru), Santai (Hijau), Sholat (Kuning)
        createZone(-6, -6, 10, 10, 0xbbdefb); // Kiri Atas
        createZone(6, 6, 10, 10, 0xc8e6c9);   // Kanan Bawah
        createZone(-6, 6, 10, 10, 0xfff9c4);  // Kiri Bawah
        createZone(6, -6, 10, 10, 0xffffff);  // Kanan Atas

        // Dinding (Sederhana)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        function createWall(x, z, w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, wallMat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true; mesh.receiveShadow = true;
            scene.add(mesh);
        }
        createWall(0, -12, 24, 4, 0.5); // Dinding belakang
        createWall(-12, 0, 0.5, 4, 24); // Dinding kiri
        createWall(0, 0, 24, 3, 0.5); // Sekat tengah horizontal
        createWall(0, 0, 0.5, 3, 24); // Sekat tengah vertikal

        // --- KARAKTER & NAMA TAG ---
        function createAgent(name, color, x, z) {
            const agentGroup = new THREE.Group();
            agentGroup.position.set(x, 0, z);

            // Badan
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1, 4, 8), new THREE.MeshStandardMaterial({ color: color }));
            body.position.y = 1.2; body.castShadow = true;
            agentGroup.add(body);

            // Kepala
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffcc80 }));
            head.position.y = 2.3; head.castShadow = true;
            agentGroup.add(head);

            // Nama Tag (HTML)
            const div = document.createElement('div');
            div.className = 'name-tag';
            div.textContent = name;
            const label = new CSS2DObject(div);
            label.position.set(0, 3.2, 0);
            agentGroup.add(label);

            scene.add(agentGroup);
            return agentGroup;
        }

        // 1. Manager (Biru) - Jalan
        const manager = createAgent("Manager", 0x42a5f5, -6, -6);
        // 2. Scriptwriter (Ungu) - Ngetik
        const writer = createAgent("Sinta", 0xab47bc, 6, -6);
        // 3. Sholat (Hijau) - Rukuk
        const prayer = createAgent("Budi", 0x66bb6a, -6, 6);
        // 4. Main (Oranye) - Loncat
        const player = createAgent("Andi", 0xffa726, 6, 6);

        // --- PROPERTI ---
        // Meja Ngetik
        const desk = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), new THREE.MeshStandardMaterial({ color: 0x8d6e63 }));
        desk.position.set(6, 0.5, -5); desk.castShadow = true; scene.add(desk);
        
        // Sajadah
        const mat = new THREE.Mesh(new THREE.PlaneGeometry(2, 3), new THREE.MeshStandardMaterial({ color: 0x4db6ac }));
        mat.rotation.x = -Math.PI / 2; mat.position.set(-6, 0.02, 7); mat.receiveShadow = true; scene.add(mat);

        // Bola
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({ color: 0xe53935 }));
        ball.castShadow = true; scene.add(ball);

        // --- ANIMASI ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Manager jalan
            manager.position.x = -6 + Math.sin(time * 1.5) * 3;
            manager.rotation.y = Math.cos(time * 1.5) > 0 ? Math.PI/2 : -Math.PI/2;

            // Sinta ngetik
            writer.position.y = Math.abs(Math.sin(time * 10)) * 0.15;
            writer.rotation.y = Math.PI; // Ngadep meja

            // Budi Sholat
            const prayCycle = Math.sin(time * 0.8);
            if (prayCycle > 0.5) {
                prayer.rotation.x = -Math.PI / 3; prayer.position.y = -0.4;
            } else {
                prayer.rotation.x = 0; prayer.position.y = 0;
            }

            // Andi Main Bola
            player.position.y = Math.abs(Math.sin(time * 4)) * 1.5;
            ball.position.set(6 + Math.cos(time * 3) * 2, 0.4 + Math.abs(Math.sin(time * 6)) * 1.5, 6 + Math.sin(time * 3) * 2);
            ball.rotation.x += 0.05; ball.rotation.z += 0.05;

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
